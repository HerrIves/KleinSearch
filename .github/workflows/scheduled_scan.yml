name: Scheduled Scan

on:
  schedule:
    # Run every 3 hours at minute 20 (avoids top-of-hour congestion)
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Run Headless Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore and save notified ads cache
        uses: actions/cache@v4
        with:
          path: data/notified_ids.json
          key: notified-ids-${{ github.run_id }}
          restore-keys: |
            notified-ids-

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: "true"
        run: |
          python src/main.py --no-ui

      - name: Upload execution log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-log
          path: data/scanner.log
          if-no-files-found: ignore

      - name: Prepare dashboard for GitHub Pages
        if: success()
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
